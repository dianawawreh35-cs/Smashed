name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Two jobs where there was one, and the split is forced rather than chosen.
  #
  # The tests need PostgreSQL. GitHub can attach a database to a job for its
  # lifetime, but only on Linux — service containers do not run on Windows
  # machines. The Agent App is net10.0-windows and builds nowhere else. So the
  # Windows machine builds, the Linux machine tests, and neither waits for the
  # other.
  build:
    name: .NET build (Windows)
    # windows-latest so the WPF Agent App (net10.0-windows) builds too. This job
    # exists to prove that it still compiles; the tests run on Linux beside it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Both: the Agent App is net10.0-windows, everything else is net8.0.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CallCenter.sln

      - name: Build
        run: dotnet build CallCenter.sln --configuration Release --no-restore

  test:
    name: .NET test (Linux, with PostgreSQL)
    runs-on: ubuntu-latest

    # The database, for the life of this job. Started before the steps run,
    # thrown away after, and reachable at localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: callcenter
          POSTGRES_USER: callcenter
          POSTGRES_PASSWORD: callcenter
        ports:
          - 5432:5432
        # Without this the steps can start before PostgreSQL is accepting
        # connections, and the first test to touch it fails for a reason that
        # has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U callcenter -d callcenter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by the server through IConfiguration, exactly as in production
      # (runbook step 5). Its presence is also what tells the test host there is
      # a database to migrate — see CallCenterApiFactory.
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=callcenter;Username=callcenter;Password=callcenter"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The two test projects by name, not the solution: the solution contains
      # the Agent App, which cannot be built here. Neither test project
      # references it.
      - name: Shared tests
        run: >-
          dotnet test tests/CallCenter.Shared.Tests --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Server tests
        run: >-
          dotnet test tests/CallCenter.Server.Tests --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  web:
    name: Web build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CallCenter.Web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/CallCenter.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CallCenter.Server/Dockerfile
          tags: callcenter-api:latest
          push: false
