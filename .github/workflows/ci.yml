name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Two jobs where there was one, and the split is forced rather than chosen.
  #
  # The tests need PostgreSQL. GitHub can attach a database to a job for its
  # lifetime, but only on Linux — service containers do not run on Windows
  # machines. The Agent App is net10.0-windows and builds nowhere else. So the
  # Windows machine builds, the Linux machine tests, and neither waits for the
  # other.
  build:
    name: .NET build (Windows)
    # windows-latest so the WPF Agent App (net10.0-windows) builds too. This job
    # exists to prove that it still compiles; the tests run on Linux beside it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Everything is .NET 10 since 19 Sep 2026; the Agent App is
      # net10.0-windows, which is why this job is on Windows.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CallCenter.sln

      - name: Build
        run: dotnet build CallCenter.sln --configuration Release --no-restore

      # The Agent App's own tests need Windows, as the app does. They need no
      # database, so they run here rather than on the Linux job.
      - name: Agent App tests
        run: dotnet test tests/CallCenter.AgentApp.Tests --configuration Release --no-build

      # M-S12 (27 Sep review): nothing looked for known vulnerabilities. This
      # is the whole solution, the Agent App included, which only builds here.
      # `dotnet list package --vulnerable` exits 0 whatever it finds, so the
      # step reads what it says.
      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list CallCenter.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A NuGet package has a known vulnerability; see the list above."
            exit 1
          fi

  test:
    name: .NET test (Linux, with PostgreSQL)
    runs-on: ubuntu-latest

    # A run that hangs fails in minutes, not after GitHub's six hours. A normal
    # run is about two minutes of tests.
    timeout-minutes: 20

    # The database, for the life of this job. Started before the steps run,
    # thrown away after, and reachable at localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: callcenter
          POSTGRES_USER: callcenter
          POSTGRES_PASSWORD: callcenter
        ports:
          - 5432:5432
        # Without this the steps can start before PostgreSQL is accepting
        # connections, and the first test to touch it fails for a reason that
        # has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U callcenter -d callcenter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by the server through IConfiguration, exactly as in production
      # (runbook step 5). Its presence is also what tells the test host there is
      # a database to migrate — see CallCenterApiFactory.
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=callcenter;Username=callcenter;Password=callcenter"
      # The restaurant's zone, as the production container has it (Dockerfile).
      # In UTC the reports' days and "today" (S-20) are never cut by a clock
      # change, so a mistake there passed CI for months (F-06, 27 Sep).
      TZ: Asia/Hebron

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The two test projects by name, not the solution: the solution contains
      # the Agent App, which cannot be built here. Neither test project
      # references it.
      - name: Shared tests
        run: >-
          dotnet test tests/CallCenter.Shared.Tests --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Server tests
        run: >-
          dotnet test tests/CallCenter.Server.Tests --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  web:
    name: Web build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CallCenter.Web
    steps:
      - uses: actions/checkout@v4

      # 22: the web app's tools ask for 22.12 or later (engines in package.json).
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/CallCenter.Web/package-lock.json

      - name: Install
        run: npm ci

      # M-S12: a known high or critical vulnerability in what ships to the
      # browser fails the build. Dev-only tools (Vite, Vitest) are left out:
      # they never reach the restaurant.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CallCenter.Server/Dockerfile
          tags: callcenter-api:latest
          push: false
