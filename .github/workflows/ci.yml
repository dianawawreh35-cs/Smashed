name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: .NET build & test
    # windows-latest so the WPF Agent App (net10.0-windows) builds too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Both: the Agent App is net10.0-windows, everything else is net8.0.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CallCenter.sln

      - name: Build
        run: dotnet build CallCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CallCenter.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  web:
    name: Web build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CallCenter.Web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/CallCenter.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CallCenter.Server/Dockerfile
          tags: callcenter-api:latest
          push: false
