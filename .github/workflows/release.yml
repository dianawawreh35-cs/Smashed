# Publishes a versioned API image to the GitHub Container Registry.
#
# Triggered by pushing a version tag:
#
#   git tag v1.2
#   git push --tags
#
# The image is then permanently available as
#   ghcr.io/<owner>/callcenter-api:v1.2
# and inherits this repository's visibility, so it is private.
#
# This workflow only publishes; GitHub cannot reach the restaurant's server.
# The server fetches a new release itself at 04:30 (deploy/auto-update.sh),
# unless the tag message says "deploy: manual" (docs/RELEASING.md).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2-test'
        required: true

env:
  IMAGE_NAME: callcenter-api

jobs:
  # Never publish an image whose tests did not pass. The WPF Agent App cannot
  # build on Linux and is covered by ci.yml.
  verify:
    name: Tests
    runs-on: ubuntu-latest

    # The same database ci.yml gives its tests. Without it the server tests
    # that need one were meant to skip, but the test host kept retrying a
    # connection that could never succeed, and v0.2.0's run sat in "Server
    # tests" for ten minutes before it was cancelled (26 Sep). A release now
    # runs exactly the tests CI runs, against a real PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: callcenter
          POSTGRES_USER: callcenter
          POSTGRES_PASSWORD: callcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callcenter -d callcenter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=callcenter;Username=callcenter;Password=callcenter"
      # The restaurant's zone, as in ci.yml and the production container (F-06).
      TZ: Asia/Hebron

    # A test run that hangs fails the release in minutes, not after GitHub's six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Shared tests
        run: dotnet test tests/CallCenter.Shared.Tests --configuration Release

      - name: Server tests
        run: dotnet test tests/CallCenter.Server.Tests --configuration Release

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/CallCenter.Web/package-lock.json

      - name: Web tests
        working-directory: src/CallCenter.Web
        run: npm ci && npm test

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The typed version reaches the script through env:, quoted, never pasted
      # into it (27 Sep review): pasted, "v1; rm -rf ~" would have run. It must
      # also look like a version, since it becomes an image tag.
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
            echo "::error::'$VERSION' is not a version like v1.2 or v1.2-test"
            exit 1
          fi
          OWNER=$(printf '%s' "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION"                                   >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/${IMAGE_NAME}"                  >> "$GITHUB_OUTPUT"
          # :latest moves only for a real release, a pushed tag. A test build
          # from the Actions page gets its own tag and leaves :latest alone.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "latest=true"  >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          # What the tag message asks of the server's nightly auto-update
          # (deploy/auto-update.sh): a line "deploy: manual" keeps it from
          # installing this version, and "deploy: seed" runs the seed after
          # it. A test build has no tag message, and neither.
          MANUAL=false
          SEED=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # checkout can leave the tag without its message; fetch it as pushed.
            git fetch --force --depth=1 origin "refs/tags/$VERSION:refs/tags/$VERSION"
            if [ "$(git cat-file -t "refs/tags/$VERSION")" = "tag" ]; then
              MESSAGE=$(git tag -l --format='%(contents)' "$VERSION")
              if printf '%s\n' "$MESSAGE" | grep -Eiq '^[[:space:]]*deploy:.*manual'; then MANUAL=true; fi
              if printf '%s\n' "$MESSAGE" | grep -Eiq '^[[:space:]]*deploy:.*seed'; then SEED=true; fi
            fi
          fi
          echo "manual=$MANUAL" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED"     >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (deploy: manual=$MANUAL, seed=$SEED)"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CallCenter.Server/Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            callcenter.deploy.manual=${{ steps.version.outputs.manual }}
            callcenter.deploy.seed=${{ steps.version.outputs.seed }}

      - name: How to use it
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### Published \`$VERSION\`"
            echo ""
            if [ "${{ steps.version.outputs.latest }}" != "true" ]; then
              echo "A test build: the server's nightly update ignores it."
            elif [ "${{ steps.version.outputs.manual }}" = "true" ]; then
              echo "**Marked \`deploy: manual\`:** the server will not install it by itself. Deploy it by hand, as below."
            else
              echo "The server installs it by itself tonight at 04:30$([ "${{ steps.version.outputs.seed }}" = "true" ] && echo ', and runs the seed after it'). To install it now instead, deploy it by hand, as below."
            fi
            echo ""
            echo "The image is private. Log in once on the machine that pulls it:"
            echo ""
            echo '```bash'
            echo "echo \$GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
            echo '```'
            echo ""
            echo "**To deploy it, on your development machine:**"
            echo ""
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo "docker tag  $IMAGE:$VERSION callcenter-api:$VERSION"
            echo "docker save callcenter-api:$VERSION -o callcenter-api-$VERSION.tar"
            echo "scp callcenter-api-$VERSION.tar smashed@192.168.1.100:/opt/callcenter/"
            echo '```'
            echo ""
            echo "**Then on the server:**"
            echo ""
            echo '```bash'
            echo "cd /opt/callcenter && ./update.sh $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
