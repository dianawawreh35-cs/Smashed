# PostgreSQL only, for local development against `dotnet run`.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   dotnet run --project src/CallCenter.Server
#
# Credentials match the default connection string in appsettings.Development.json.

services:
  db:
    image: postgres:16
    container_name: callcenter-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: callcenter
      TZ: Asia/Hebron
      PGTZ: Asia/Hebron
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcenter -d callcenter"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
