# Production stack for the Restaurant Call Center System.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d
#
# The API runs with network_mode: host so it uses the host's VPN route to the
# PBX, for the CDR import (runbook step 8). It makes no SIP or audio connection:
# the softphone runs on each agent's laptop.

services:
  db:
    image: postgres:16
    container_name: callcenter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Hebron}
      PGTZ: ${TZ:-Asia/Hebron}
    ports:
      # Bound to loopback only - never expose PostgreSQL on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcenter -d callcenter"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: callcenter-api:latest
    container_name: callcenter-api
    restart: unless-stopped
    # Host networking, so the container uses the host's VPN route to the
    # provider.
    network_mode: host
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Port 80 so the supervisor can reach the app by typing the server IP
      # alone, with no port number. 5000 stays for the container healthcheck.
      ASPNETCORE_URLS: http://0.0.0.0:80;http://0.0.0.0:5000
      ConnectionStrings__Default: "Host=127.0.0.1;Port=5432;Database=callcenter;Username=callcenter;Password=${POSTGRES_PASSWORD}"
      # Signs the tokens the Agent App and the supervisor app hold. Changing it
      # signs everyone out.
      Jwt__SigningKey: ${JWT_SECRET}
      # Encrypts the agents' SIP secrets in the users table.
      Security__SipSecretKey: ${SIP_SECRET_KEY}
      Recordings__Path: /data/recordings
      # The menu photographs (A-66). A folder rather than rows, because the
      # nightly rsync copies unchanged files once and pg_dump re-dumps them
      # every night.
      MenuImages__Path: /data/menu-images
      TZ: ${TZ:-Asia/Hebron}
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/menu-images:/data/menu-images
      - ./data/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
