<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1115" />
    <!-- The Smashed logo, made by tools/icons/make_icons.py. Served by the
         server itself, so the tab has its icon with no internet. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>مركز الاتصال | Call Center</title>

    <!-- Light or dark (S-69), on the page before it is drawn, so a light page
         does not flash dark while the app loads. The same key and values as
         src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem('callcenter.theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F5F7')
        }
      } catch (e) {}
    </script>

    <!--
      Cairo carries Arabic and Latin in one family, so a customer name and a
      phone number on the same line do not change typeface. It is bundled with
      the app (main.tsx, @fontsource/cairo) rather than fetched from Google
      Fonts: the server is on a LAN with no internet, so that link never loaded
      and every screen fell back to Segoe UI.
    -->
  </head>
  <body class="bg-ink-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
